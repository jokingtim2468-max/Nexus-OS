name: Quickshell (Windows)

# Builds our Windows port of Quickshell (macshell-win/quickshell) into qs.exe.
# Runs on GitHub's Windows runners (free for public repos) with MSYS2's Qt 6.

on:
  push:
    paths:
      - "macshell-win/quickshell/**"
      - "macshell-win/macshell/**"
      - "macshell-win/compat/**"
      - "macshell-win/tools/**"
      - ".github/workflows/quickshell-windows.yml"
  workflow_dispatch:

permissions:
  contents: write                 # publish the freeform-latest release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            cli11:p
            qt6-base:p
            qt6-declarative:p
            qt6-shadertools:p
            qt6-svg:p
            qt6-imageformats:p
            qt6-multimedia:p

      # qs.exe only changes when macshell-win/quickshell does: reuse the last build otherwise
      # (bump "v1" to force a rebuild, e.g. after a big MSYS2 Qt update)
      - uses: actions/cache@v4
        id: qscache
        with:
          path: qs-bin
          key: qs-v1-${{ hashFiles('macshell-win/quickshell/**') }}

      - name: Configure
        if: steps.qscache.outputs.cache-hit != 'true'
        run: |
          cmake -S macshell-win/quickshell -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDISTRIBUTOR="FreeForm (Nexus-OS) Windows port" \
            -DGIT_REVISION="${GITHUB_SHA}"

      - name: Build
        if: steps.qscache.outputs.cache-hit != 'true'
        run: |
          cmake --build build -- -k 0
          mkdir -p qs-bin
          cp "$(find build -maxdepth 2 -name quickshell.exe | head -n1)" qs-bin/quickshell.exe

      - name: Bundle Qt runtime
        run: |
          mkdir -p dist
          exe=qs-bin/quickshell.exe
          test -f "$exe" || { echo "quickshell.exe not found"; exit 1; }
          cp "$exe" dist/qs.exe
          deploy=$(command -v windeployqt6 || command -v windeployqt || true)
          if [ -n "$deploy" ]; then
            "$deploy" --qmldir macshell-win/macshell --no-translations dist/qs.exe || true
          fi
          # Qt's QML modules (QtQuick.Effects, Controls, Shapes, ...) next to the exe, then every
          # MSYS2 DLL the exe and those plugins need (libstdc++, icu, zstd, Qt6QuickEffects, ...)
          cp -r "$MINGW_PREFIX/share/qt6/qml" dist/
          for f in dist/qs.exe $(find dist -name '*.dll'); do ldd "$f"; done | awk '/ucrt64/ {print $3}' | sort -u | xargs -r -I{} cp -n {} dist/
          dist/qs.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: qs-windows-x64
          path: dist/

      # The FreeForm package: qs.exe + Qt, MacShell, the Windows layer, a private Python, launcher.
      - name: Package FreeForm
        run: |
          P=pkg/FreeForm
          mkdir -p $P/compat $P/tools
          cp -r dist $P/bin
          cp -r macshell-win/macshell $P/shell
          cp -r macshell-win/compat/helper macshell-win/compat/qml $P/compat/
          # the Linux sh wrapper and the .exe share a name as far as MSYS is concerned: drop the wrapper
          rm -f $P/compat/helper/macshell-helper
          gcc -O2 -municode -o $P/compat/helper/macshell-helper.exe $P/compat/helper/helper-shim.c
          cp -r macshell-win/tools/fffetch $P/tools/
          cp macshell-win/tools/launcher/* $P/
          echo "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" > $P/version.txt
          cp macshell-win/macshell/LICENSE $P/LICENSE-MacShell.txt
          cp macshell-win/quickshell/LICENSE $P/LICENSE-Quickshell.txt
          # official embeddable Python from python.org (PSF licence), private to FreeForm
          curl -sSL -o py.zip https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip
          mkdir -p $P/python && (cd $P/python && unzip -q ../../../py.zip)
          rm -rf $P/compat/helper/__pycache__ $P/shell/hypr-scripts-reference

      - uses: actions/upload-artifact@v4
        with:
          name: FreeForm-windows-x64
          path: pkg/

      # Run MacShell on the Windows build and take a screenshot of the desktop (the runner has an
      # interactive desktop session). Uploads the screenshot and Quickshell's log.
      - name: Smoke run MacShell
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $root = (Get-Location).Path
          $pkg = "$root\pkg\FreeForm"
          $env:FREEFORM_ROOT = $pkg
          $env:QML_IMPORT_PATH = "$pkg\bin\qml;$pkg\compat\qml"
          $env:FREEFORM_HELPER = "$pkg\compat\helper"
          $env:HOME = $env:USERPROFILE
          $env:PATH = "$pkg\python;$env:FREEFORM_HELPER;$env:PATH"
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          & "$env:FREEFORM_HELPER\macshell-helper.exe" apps sync *> smoke\apps-sync.txt
          "apps sync: $(Get-Content smoke\apps-sync.txt -Raw)"
          Get-ChildItem "$env:USERPROFILE\.local\share\applications" -ErrorAction SilentlyContinue | Select-Object -First 60 Name | Out-File smoke\apps-list.txt
          Get-Content smoke\apps-list.txt
          Get-Content "$env:USERPROFILE\.local\share\applications\ff-freeform_widget_studio.desktop" -ErrorAction SilentlyContinue
          $shell = "$pkg\shell\shell.qml"
          $p = Start-Process -FilePath "$pkg\bin\qs.exe" -ArgumentList @("-p", "`"$shell`"", "-vv") `
                 -RedirectStandardOutput smoke\qs-out.log -RedirectStandardError smoke\qs-err.log -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
          }
          function Ipc { & "$pkg\bin\qs.exe" ipc -p $shell call @args *>> smoke\ipc.txt }
          Start-Sleep -Seconds 35
          Ipc tour stop; Start-Sleep -Seconds 3; Shot desktop
          Ipc widgetstudio open; Start-Sleep -Seconds 6; Shot widgetstudio; Ipc widgetstudio close
          Ipc music open; Start-Sleep -Seconds 6; Shot music; Ipc music close
          Ipc themestudio open; Start-Sleep -Seconds 5; Shot themestudio; Ipc themestudio close
          Ipc about open; Start-Sleep -Seconds 5; Shot about
          "exited: $($p.HasExited)  code: $(if ($p.HasExited) { $p.ExitCode })" | Tee-Object smoke\status.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content smoke\ipc.txt
          Select-String -Path smoke\qs-err.log, smoke\qs-out.log -Pattern 'ERROR|WARN.*(qml|QML)|is not a type|not installed|ReferenceError|TypeError' | Select-Object -First 80 | ForEach-Object { $_.Line }

      - name: Check PowerShell scripts and the launcher window
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem macshell-win -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          $env:FREEFORM_LAUNCHER_TEST = '1'
          $out = powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File pkg\FreeForm\FreeFormLauncher.ps1 2>&1
          "launcher: $out"
          if ("$out" -notmatch 'launcher window ok') { $bad++ }
          if ($bad) { exit 1 }

      - name: fetch in cmd and PowerShell
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          cmd /c "macshell-win\tools\fffetch\fetch.cmd" *> smoke\fffetch-cmd.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe net status *> smoke\helper-net.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe bt status *> smoke\helper-bt.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe store search vlc *> smoke\helper-store.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe about *> smoke\helper-about.txt
          powershell -NoProfile -ExecutionPolicy Bypass -File macshell-win\tools\fffetch\fetch-core.ps1 *> smoke\fffetch-ps.txt
          Get-Content smoke\fffetch-ps.txt
          foreach ($f in 'fffetch-cmd', 'helper-net', 'helper-bt', 'helper-store', 'helper-about') { "── $f"; Get-Content "smoke\$f.txt" -TotalCount 25 }

      # The one-line installer (tools/launcher/get.ps1) downloads this zip from the
      # "freeform-latest" pre-release, refreshed on every push to the FreeForm branch.
      - name: Publish freeform-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/vibe-coded/sharp-noether-i8tg9c'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pkg\FreeForm -DestinationPath FreeForm-windows-x64.zip -Force
          gh release view freeform-latest -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create freeform-latest -R $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA `
              --title "FreeForm (latest build)" --notes "Built automatically from the FreeForm branch."
          }
          gh release upload freeform-latest FreeForm-windows-x64.zip pkg\FreeForm\version.txt -R $env:GITHUB_REPOSITORY --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macshell-windows-smoke
          path: smoke/
