name: Quickshell (Windows)

# Builds our Windows port of Quickshell (macshell-win/quickshell) into qs.exe.
# Runs on GitHub's Windows runners (free for public repos) with MSYS2's Qt 6.

on:
  push:
    paths:
      - "macshell-win/quickshell/**"
      - "macshell-win/macshell/**"
      - "macshell-win/compat/**"
      - "macshell-win/tools/**"
      - ".github/workflows/quickshell-windows.yml"
  workflow_dispatch:

# a newer push replaces a build still running for the same branch
concurrency:
  group: quickshell-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write                 # publish the freeform-latest release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            cli11:p
            qt6-base:p
            qt6-declarative:p
            qt6-shadertools:p
            qt6-svg:p
            qt6-imageformats:p
            qt6-multimedia:p

      # qs.exe only changes when macshell-win/quickshell does: reuse the last build otherwise
      # (bump "v1" to force a rebuild, e.g. after a big MSYS2 Qt update)
      - uses: actions/cache@v4
        id: qscache
        with:
          path: qs-bin
          key: qs-v1-${{ hashFiles('macshell-win/quickshell/**') }}

      - name: Configure
        if: steps.qscache.outputs.cache-hit != 'true'
        run: |
          cmake -S macshell-win/quickshell -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDISTRIBUTOR="FreeForm (Nexus-OS) Windows port" \
            -DGIT_REVISION="${GITHUB_SHA}"

      - name: Build
        if: steps.qscache.outputs.cache-hit != 'true'
        run: |
          cmake --build build -- -k 0
          mkdir -p qs-bin
          cp "$(find build -maxdepth 2 -name quickshell.exe | head -n1)" qs-bin/quickshell.exe

      - name: Bundle Qt runtime
        run: |
          mkdir -p dist
          exe=qs-bin/quickshell.exe
          test -f "$exe" || { echo "quickshell.exe not found"; exit 1; }
          cp "$exe" dist/qs.exe
          deploy=$(command -v windeployqt6 || command -v windeployqt || true)
          if [ -n "$deploy" ]; then
            "$deploy" --qmldir macshell-win/macshell --no-translations dist/qs.exe || true
          fi
          # Qt's QML modules (QtQuick.Effects, Controls, Shapes, ...) next to the exe, then every
          # MSYS2 DLL the exe and those plugins need (libstdc++, icu, zstd, Qt6QuickEffects, ...)
          cp -r "$MINGW_PREFIX/share/qt6/qml" dist/
          for f in dist/qs.exe $(find dist -name '*.dll'); do ldd "$f"; done | awk '/ucrt64/ {print $3}' | sort -u | xargs -r -I{} cp -n {} dist/
          dist/qs.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: qs-windows-x64
          path: dist/

      # The FreeForm package: qs.exe + Qt, MacShell, the Windows layer, a private Python, launcher.
      - name: Package FreeForm
        run: |
          P=pkg/FreeForm
          mkdir -p $P/compat $P/tools
          cp -r dist $P/bin
          cp -r macshell-win/macshell $P/shell
          cp -r macshell-win/compat/helper macshell-win/compat/qml $P/compat/
          # the Linux sh wrapper and the .exe share a name as far as MSYS is concerned: drop the wrapper
          rm -f $P/compat/helper/macshell-helper
          gcc -O2 -municode -o $P/compat/helper/macshell-helper.exe $P/compat/helper/helper-shim.c
          # the same shim under the Linux tool names MacShell's Settings call (see winsys.py)
          for t in xdg-open brightnessctl powerprofilesctl notify-send; do cp $P/compat/helper/macshell-helper.exe $P/compat/helper/$t.exe; done
          cp -r macshell-win/tools/fffetch $P/tools/
          # default wallpaper: Yosemite Valley from Tunnel View, by Diliff, CC BY-SA 3.0 (Wikimedia Commons)
          for i in 1 2 3 4; do
            curl -fsSL -A "FreeForm-CI/1.0 (https://github.com/jokingtim2468-max/Nexus-OS)" -o "$P/shell/assets/wallpapers/FreeForm Yosemite.jpg" \
              "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Tunnel_View%2C_Yosemite_Valley%2C_Yosemite_NP_-_Diliff.jpg/3840px-Tunnel_View%2C_Yosemite_Valley%2C_Yosemite_NP_-_Diliff.jpg" \
              && file "$P/shell/assets/wallpapers/FreeForm Yosemite.jpg" | grep -q JPEG && break
            sleep $((i * 5))
          done
          file "$P/shell/assets/wallpapers/FreeForm Yosemite.jpg" | grep JPEG
          # macOS-style icons (MacTahoe, GPL-3.0) and Qt's SVG plugins to draw them
          bash macshell-win/tools/icons/build-theme.sh $P/icons
          mkdir -p $P/bin/imageformats $P/bin/iconengines
          cp -n "$MINGW_PREFIX"/share/qt6/plugins/imageformats/qsvg.dll $P/bin/imageformats/ 2>/dev/null || true
          cp -n "$MINGW_PREFIX"/share/qt6/plugins/iconengines/qsvgicon.dll $P/bin/iconengines/ 2>/dev/null || true
          ls $P/bin/imageformats $P/bin/iconengines
          cp macshell-win/tools/launcher/* $P/
          echo "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" > $P/version.txt
          cp macshell-win/macshell/LICENSE $P/LICENSE-MacShell.txt
          cp macshell-win/quickshell/LICENSE $P/LICENSE-Quickshell.txt
          # official embeddable Python from python.org (PSF licence), private to FreeForm
          curl -sSL -o py.zip https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip
          mkdir -p $P/python && (cd $P/python && unzip -q ../../../py.zip)
          rm -rf $P/compat/helper/__pycache__ $P/shell/hypr-scripts-reference

      - uses: actions/upload-artifact@v4
        with:
          name: FreeForm-windows-x64
          path: pkg/

      # Run MacShell on the Windows build and take a screenshot of the desktop (the runner has an
      # interactive desktop session). Uploads the screenshot and Quickshell's log.
      - name: Smoke run MacShell
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $root = (Get-Location).Path
          $pkg = "$root\pkg\FreeForm"
          $env:FREEFORM_ROOT = $pkg
          $env:QML_IMPORT_PATH = "$pkg\bin\qml;$pkg\compat\qml"
          $env:FREEFORM_HELPER = "$pkg\compat\helper"
          $env:HOME = $env:USERPROFILE
          $env:PATH = "$pkg\python;$env:FREEFORM_HELPER;$env:PATH"
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          # never let a stuck step hang the job: everything below runs with a time limit
          function Run-Limited($exe, $argList, $out, $seconds) {
            $pr = Start-Process -FilePath $exe -ArgumentList $argList -NoNewWindow -PassThru -RedirectStandardOutput "$out.out" -RedirectStandardError "$out.err"
            if (-not $pr.WaitForExit($seconds * 1000)) { "TIMED OUT after $seconds s: $exe $argList" | Tee-Object -Append $out; Stop-Process -Id $pr.Id -Force }
            Get-Content "$out.out", "$out.err" -ErrorAction SilentlyContinue | Add-Content $out
          }
          Run-Limited "$env:FREEFORM_HELPER\macshell-helper.exe" @('apps', 'sync') smoke\apps-sync.txt 420
          "apps sync: $(Get-Content smoke\apps-sync.txt -Raw)"
          Get-ChildItem "$env:USERPROFILE\.local\share\applications" -ErrorAction SilentlyContinue | Select-Object -First 60 Name | Out-File smoke\apps-list.txt
          Get-Content smoke\apps-list.txt
          Get-Content "$env:USERPROFILE\.local\share\applications\ff-freeform_widget_studio.desktop" -ErrorAction SilentlyContinue
          $shell = "$pkg\shell\shell.qml"
          $p = Start-Process -FilePath "$pkg\bin\qs.exe" -ArgumentList @("-p", "`"$shell`"", "-vv") `
                 -RedirectStandardOutput smoke\qs-out.log -RedirectStandardError smoke\qs-err.log -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) { powershell.exe -NoProfile -ExecutionPolicy Bypass -File macshell-win\tools\ci\ScreenGrab.ps1 "$((Get-Location).Path)\smoke\$name.png" }
          function Ipc { Run-Limited "$pkg\bin\qs.exe" (@('ipc', '-vv', '-p', "`"$shell`"", 'call') + $args) smoke\ipc.txt 30 }
          Start-Sleep -Seconds 35
          Run-Limited "$pkg\bin\qs.exe" @('list', '--all', '-vv') smoke\qs-list.txt 20
          Get-Content smoke\qs-list.txt
          Ipc tour stop; Start-Sleep -Seconds 3; Shot desktop
          Ipc widgetstudio open; Start-Sleep -Seconds 6; Shot widgetstudio; Ipc widgetstudio close
          Ipc music open; Start-Sleep -Seconds 6; Shot music; Ipc music close
          Ipc themestudio open; Start-Sleep -Seconds 5; Shot themestudio; Ipc themestudio close
          Ipc about open; Start-Sleep -Seconds 5; Shot about
          "exited: $($p.HasExited)  code: $(if ($p.HasExited) { $p.ExitCode })" | Tee-Object smoke\status.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content smoke\ipc.txt
          "── IPC on the shell's side"
          Select-String -Path smoke\qs-err.log, smoke\qs-out.log -Pattern 'ipc|IPC' | Where-Object { $_.Line -notmatch 'Registered' } | Select-Object -First 60 | ForEach-Object { $_.Line }
          Select-String -Path smoke\qs-err.log, smoke\qs-out.log -Pattern 'ERROR|WARN.*(qml|QML)|is not a type|not installed|ReferenceError|TypeError' | Select-Object -First 80 | ForEach-Object { $_.Line }

      - name: Check PowerShell scripts and the launcher window
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem macshell-win -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          $env:FREEFORM_LAUNCHER_TEST = '1'
          $out = powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File pkg\FreeForm\FreeFormLauncher.ps1 2>&1
          "launcher: $out"
          if ("$out" -notmatch 'launcher window ok') { $bad++ }
          if ($bad) { exit 1 }

      # What a customer does: install, press Launch (FreeForm.ps1 -Force), later Back to Windows (-Stop)
      - name: Install and launch like a customer
        shell: pwsh
        timeout-minutes: 8
        run: |
          $pkg = "$((Get-Location).Path)\pkg\FreeForm"
          Get-Process qs -ErrorAction SilentlyContinue | Stop-Process -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1"
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'FreeForm.lnk'
          "desktop shortcut: $(Test-Path $lnk)  icon: $((New-Object -ComObject WScript.Shell).CreateShortcut($lnk).IconLocation)"
          # a yellow sticky note placed on the desktop, to check widgets really show
          $cfg = Join-Path $env:USERPROFILE '.config\macshell'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          '{"widgets":[{"id":"t1","name":"Note","onDesktop":true,"x":300,"y":300,"w":220,"h":200,"bg":{"color":"#FFD60A","opacity":1,"radius":18,"border":false},"items":[]}]}' | Set-Content (Join-Path $cfg 'custom-widgets.json')
          $launcher = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$pkg\FreeForm.ps1`"", '-Force') -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 40
          # CI's own (maximised) terminal would cover the desktop: minimise everything but FreeForm's panels
          (New-Object -ComObject Shell.Application).MinimizeAll(); Start-Sleep -Seconds 5
          $qs = Get-Process qs -ErrorAction SilentlyContinue
          "qs running: $([bool]$qs)   launcher running: $(-not $launcher.HasExited)"
          # look at the screen: wallpaper present (not black), widget present (yellow)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $shot = "$((Get-Location).Path)\smoke\customer-desktop.png"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File macshell-win\tools\ci\ScreenGrab.ps1 $shot
          $bmp = [System.Drawing.Bitmap]::FromFile($shot)
          $w = $bmp.GetPixel(410, 400); $wp = $bmp.GetPixel([int]($b.Width * 0.8), [int]($b.Height * 0.5))
          "samples: " + ((0.1, 0.3, 0.5, 0.7, 0.9) | ForEach-Object { $bmp.GetPixel([int]($b.Width * $_), [int]($b.Height * 0.6)) } | ForEach-Object { "($($_.R),$($_.G),$($_.B))" }) -join ' '
          "── qs warnings"; Get-ChildItem (Join-Path $env:LOCALAPPDATA 'FreeForm\logs') -Filter 'run-*.err.log' | Select-Object -Last 1 | ForEach-Object { Select-String -Path $_.FullName -Pattern 'WARN|ERROR' | Where-Object { $_.Line -notmatch 'Binding loop' } | Select-Object -First 25 | ForEach-Object { $_.Line } }
          "widget pixel: $w   wallpaper pixel: $wp"
          $widgetOk = $w.R -gt 200 -and $w.G -gt 170 -and $w.B -lt 90
          $wallOk = ($wp.R + $wp.G + $wp.B) -gt 40
          "widget on desktop: $widgetOk   wallpaper shown: $wallOk"
          $logs = Join-Path $env:LOCALAPPDATA 'FreeForm\logs'
          "── launcher.log"; Get-Content (Join-Path $logs 'launcher.log') -Tail 40 -ErrorAction SilentlyContinue
          "── qs errors"; Get-ChildItem $logs -Filter 'run-*.err.log' | Select-Object -Last 1 | ForEach-Object { Select-String -Path $_.FullName -Pattern 'ERROR|is not a type|ReferenceError|TypeError|Cannot open' | Select-Object -First 30 | ForEach-Object { $_.Line } }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\FreeForm.ps1" -Stop
          Start-Sleep -Seconds 8
          "after Stop: qs running: $([bool](Get-Process qs -ErrorAction SilentlyContinue))   launcher running: $(-not $launcher.HasExited)"
          if (-not $qs) { Write-Error 'FreeForm did not start'; exit 1 }
          if (-not $wallOk) { Write-Error 'desktop wallpaper missing'; exit 1 }
          if (-not $widgetOk) { Write-Error 'desktop widget not visible'; exit 1 }

      - name: fetch in cmd and PowerShell
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          cmd /c "macshell-win\tools\fffetch\fetch.cmd" *> smoke\fffetch-cmd.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe net status *> smoke\helper-net.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe bt status *> smoke\helper-bt.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe store search vlc *> smoke\helper-store.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe about *> smoke\helper-about.txt
          & pkg\FreeForm\compat\helper\powerprofilesctl.exe get *> smoke\helper-power.txt
          & pkg\FreeForm\compat\helper\macshell-helper.exe ffconfig get *> smoke\helper-ffconfig.txt
          & pkg\FreeForm\compat\helper\brightnessctl.exe -m *> smoke\helper-bright.txt
          # the sound devices list (one JSON line from audio.ps1, then stop it)
          $ap = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "pkg\FreeForm\compat\helper\audio.ps1") -RedirectStandardOutput smoke\helper-audio.txt -RedirectStandardError smoke\helper-audio-err.txt -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15; Stop-Process -Id $ap.Id -Force -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File macshell-win\tools\fffetch\fetch-core.ps1 *> smoke\fffetch-ps.txt
          Get-Content smoke\fffetch-ps.txt
          foreach ($f in 'fffetch-cmd', 'helper-net', 'helper-bt', 'helper-store', 'helper-about', 'helper-power', 'helper-bright', 'helper-ffconfig', 'helper-audio', 'helper-audio-err') { "── $f"; Get-Content "smoke\$f.txt" -TotalCount 25 }

      # The one-line installer (tools/launcher/get.ps1) downloads this zip from the
      # "freeform-latest" pre-release, refreshed on every push to the FreeForm branch.
      - name: Publish freeform-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/vibe-coded/sharp-noether-i8tg9c'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pkg\FreeForm -DestinationPath FreeForm-windows-x64.zip -Force
          gh release view freeform-latest -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create freeform-latest -R $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA `
              --title "FreeForm (latest build)" --notes "Built automatically from the FreeForm branch."
          }
          gh release upload freeform-latest FreeForm-windows-x64.zip pkg\FreeForm\version.txt -R $env:GITHUB_REPOSITORY --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macshell-windows-smoke
          path: smoke/
