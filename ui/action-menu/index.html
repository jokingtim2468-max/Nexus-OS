<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus OS — Liquid Glass Action Menu</title>
<style>
  /* ============================================================
     Nexus OS — Liquid Glass action menu prototype
     macOS Tahoe "Liquid Glass" look, generic icons (no logos).
     ============================================================ */

  :root {
    /* Glass material tokens — tuned per theme below */
    --glass-tint:        rgba(255, 255, 255, 0.10);
    --glass-tint-hi:     rgba(255, 255, 255, 0.22);
    --glass-rim:         rgba(255, 255, 255, 0.55);
    --glass-rim-soft:    rgba(255, 255, 255, 0.14);
    --glass-blur:        22px;
    --glass-sat:         180%;
    --glass-bright:      1.08;

    --menu-radius:       16px;
    --item-radius:       9px;

    --text:              rgba(255, 255, 255, 0.92);
    --text-dim:          rgba(255, 255, 255, 0.52);
    --sep:               rgba(255, 255, 255, 0.14);

    --accent:            #0a84ff;
    --accent-grad:       linear-gradient(180deg, #3a9bff 0%, #0a84ff 100%);

    --shadow:
      0 1px 1px rgba(0,0,0,0.10),
      0 12px 28px rgba(0,0,0,0.38),
      0 2px 6px rgba(0,0,0,0.22);
  }

  :root[data-theme="light"] {
    --glass-tint:        rgba(255, 255, 255, 0.55);
    --glass-tint-hi:     rgba(255, 255, 255, 0.78);
    --glass-rim:         rgba(255, 255, 255, 0.95);
    --glass-rim-soft:    rgba(255, 255, 255, 0.5);
    --glass-bright:      1.04;

    --text:              rgba(28, 28, 30, 0.95);
    --text-dim:          rgba(60, 60, 67, 0.5);
    --sep:               rgba(60, 60, 67, 0.16);

    --shadow:
      0 1px 1px rgba(0,0,0,0.06),
      0 12px 30px rgba(0,0,0,0.18),
      0 2px 8px rgba(0,0,0,0.10);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;

    /* Vibrant wallpaper so the glass has something to refract */
    background:
      radial-gradient(120% 90% at 12% 10%, #ff6a3d 0%, transparent 45%),
      radial-gradient(130% 100% at 88% 18%, #b14bff 0%, transparent 50%),
      radial-gradient(120% 120% at 70% 95%, #16c2ff 0%, transparent 55%),
      radial-gradient(100% 100% at 20% 90%, #00d68f 0%, transparent 50%),
      linear-gradient(135deg, #1a1033 0%, #0a1230 60%, #06202e 100%);
    background-attachment: fixed;
  }

  :root[data-theme="light"] body {
    background:
      radial-gradient(120% 90% at 12% 10%, #ffd27a 0%, transparent 45%),
      radial-gradient(130% 100% at 88% 18%, #c9a7ff 0%, transparent 50%),
      radial-gradient(120% 120% at 70% 95%, #9fe0ff 0%, transparent 55%),
      radial-gradient(100% 100% at 20% 90%, #b5f5d8 0%, transparent 50%),
      linear-gradient(135deg, #eef2ff 0%, #f6f1ff 60%, #eafaff 100%);
    background-attachment: fixed;
  }

  /* Faux desktop content behind the glass (text + grid) for contrast */
  .desk {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    pointer-events: none;
  }
  .desk h1 {
    font-size: clamp(28px, 6vw, 68px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--text);
    opacity: 0.9;
    text-shadow: 0 2px 30px rgba(0,0,0,0.25);
  }
  .desk p {
    margin: 10px 0 0;
    font-size: 15px;
    color: var(--text-dim);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    font-size: 12.5px;
    color: var(--text);
    opacity: 0.8;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-rim-soft);
    box-shadow: var(--shadow);
    pointer-events: none;
  }

  .toolbar {
    position: fixed;
    top: 22px;
    right: 22px;
    display: flex;
    gap: 10px;
  }
  .glass-btn {
    appearance: none;
    cursor: pointer;
    color: var(--text);
    font: inherit;
    padding: 9px 15px;
    border-radius: 11px;
    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-rim-soft);
    box-shadow: var(--shadow);
    transition: transform .12s ease, background .15s ease;
  }
  .glass-btn:hover  { background: var(--glass-tint-hi); }
  .glass-btn:active { transform: scale(0.97); }

  /* ============================================================
     The Liquid Glass menu itself
     ============================================================ */
  .menu {
    position: fixed;
    min-width: 232px;
    padding: 6px;
    border-radius: var(--menu-radius);
    color: var(--text);

    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));

    border: 1px solid var(--glass-rim-soft);
    box-shadow: var(--shadow);

    opacity: 0;
    transform: scale(0.94);
    transform-origin: top left;
    transition: opacity .14s ease, transform .16s cubic-bezier(.2,.9,.3,1.2);
    z-index: 100;
  }
  .menu.open {
    opacity: 1;
    transform: scale(1);
  }

  /* Specular rim light — the top edge catches light like real glass */
  .menu::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(
      150deg,
      var(--glass-rim) 0%,
      transparent 28%,
      transparent 72%,
      var(--glass-rim-soft) 100%);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  /* Inner top sheen */
  .menu::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px; top: 1px;
    height: 42%;
    border-radius: var(--menu-radius);
    background: linear-gradient(180deg,
      rgba(255,255,255,0.18) 0%, transparent 100%);
    pointer-events: none;
    opacity: .6;
  }

  .menu-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 7px 11px;
    border-radius: var(--item-radius);
    cursor: default;
    color: var(--text);
    white-space: nowrap;
  }
  .menu-item .ico {
    width: 17px; height: 17px;
    flex: 0 0 17px;
    opacity: 0.85;
  }
  .menu-item .label { flex: 1; }
  .menu-item .shortcut {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .menu-item .chev { width: 13px; height: 13px; opacity: 0.6; }

  .menu-item.hl {
    background: var(--accent-grad);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35),
                0 2px 8px rgba(10,132,255,0.35);
  }
  .menu-item.hl .ico,
  .menu-item.hl .shortcut,
  .menu-item.hl .chev { opacity: 1; color: rgba(255,255,255,0.9); }

  .menu-item.disabled { color: var(--text-dim); pointer-events: none; }

  .menu-sep {
    height: 1px;
    margin: 5px 9px;
    background: var(--sep);
  }

  .menu-label {
    padding: 6px 11px 3px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* Submenu is just another .menu positioned by JS */
  .submenu { z-index: 101; }
</style>
</head>
<body>
  <div class="desk">
    <div>
      <h1>Nexus OS</h1>
      <p>Liquid Glass action menu — right-click anywhere</p>
    </div>
  </div>

  <div class="toolbar">
    <button class="glass-btn" id="themeBtn">☾ Theme</button>
    <button class="glass-btn" id="openBtn">Action ▾</button>
  </div>

  <div class="hint">Right-click the desktop, or press the Action button</div>

<script>
  // ---- Icon set (generic glyphs — deliberately NOT Apple/brand logos) ----
  const I = {
    open:   '<path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h3l1.5 2h6A1.5 1.5 0 0 1 16.5 7.5v6A1.5 1.5 0 0 1 15 15H4.5A1.5 1.5 0 0 1 3 13.5z"/>',
    copy:   '<rect x="6" y="6" width="9" height="9" rx="2"/><path d="M4 11V4.5A1.5 1.5 0 0 1 5.5 3H12" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    dup:    '<rect x="5" y="5" width="8" height="8" rx="1.8"/><rect x="8" y="8" width="8" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    share:  '<path d="M9.5 3.5v8" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M6.5 6l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 9.5v5A1.5 1.5 0 0 0 6.5 16h6A1.5 1.5 0 0 0 14 14.5v-5" fill="none" stroke="currentColor" stroke-width="1.5"/>',
    rename: '<path d="M4 13l8.5-8.5 2 2L6 15H4z"/>',
    star:   '<path d="M9.5 3l1.9 3.9 4.3.6-3.1 3 .7 4.3-3.8-2-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>',
    tag:    '<path d="M3.5 4.5h5l6 6-4 4-6-6z"/><circle cx="6" cy="7" r="1.1" fill="#000" opacity=".4"/>',
    info:   '<circle cx="9.5" cy="9.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 8.5v4M9.5 6.3v.1" stroke="currentColor" stroke-width="1.6"/>',
    trash:  '<path d="M5 6h9l-.8 9.2A1.5 1.5 0 0 1 11.7 16.5H7.3A1.5 1.5 0 0 1 5.8 15.2zM7 6V4.8A1.3 1.3 0 0 1 8.3 3.5h2.4A1.3 1.3 0 0 1 12 4.8V6" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  };
  const chev = '<svg class="chev" viewBox="0 0 19 19"><path d="M7 5l4 4.5-4 4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  function svg(path){ return '<svg class="ico" viewBox="0 0 19 19" fill="currentColor">'+path+'</svg>'; }

  // ---- Menu model ----
  const MODEL = [
    { label: 'Open',        icon: I.open,  shortcut: '⌘O' },
    { label: 'Open With',   icon: I.open,  submenu: [
        { label: 'Nexus Editor' },
        { label: 'Terminal' },
        { label: 'Preview' },
    ]},
    { type: 'sep' },
    { label: 'Copy',        icon: I.copy,  shortcut: '⌘C' },
    { label: 'Duplicate',   icon: I.dup,   shortcut: '⌘D' },
    { label: 'Share…',      icon: I.share, submenu: [
        { label: 'Copy Link' },
        { label: 'AirDrop' },
        { label: 'Messages' },
    ]},
    { type: 'sep' },
    { label: 'Rename',      icon: I.rename },
    { label: 'Add to Favorites', icon: I.star },
    { label: 'Tags…',       icon: I.tag },
    { type: 'sep' },
    { label: 'Get Info',    icon: I.info,  shortcut: '⌘I' },
    { label: 'Move to Trash', icon: I.trash, shortcut: '⌘⌫', danger: true },
  ];

  let openMenus = [];

  function buildMenu(items, isSub){
    const el = document.createElement('div');
    el.className = 'menu' + (isSub ? ' submenu' : '');
    for (const it of items){
      if (it.type === 'sep'){
        const s = document.createElement('div'); s.className = 'menu-sep'; el.appendChild(s); continue;
      }
      if (it.type === 'label'){
        const s = document.createElement('div'); s.className = 'menu-label'; s.textContent = it.label; el.appendChild(s); continue;
      }
      const row = document.createElement('div');
      row.className = 'menu-item' + (it.disabled ? ' disabled' : '');
      row.innerHTML =
        (it.icon ? svg(it.icon) : '<span class="ico"></span>') +
        '<span class="label">'+it.label+'</span>' +
        (it.submenu ? chev : (it.shortcut ? '<span class="shortcut">'+it.shortcut+'</span>' : ''));

      row.addEventListener('mouseenter', () => {
        [...el.children].forEach(c => c.classList.remove('hl'));
        row.classList.add('hl');
        closeFrom(el._level + 1);
        if (it.submenu) spawnSub(it.submenu, row, el._level + 1);
      });
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        if (it.submenu) return;
        closeAll();
      });
      el.appendChild(row);
    }
    return el;
  }

  function spawnSub(items, anchorRow, level){
    const sub = buildMenu(items, true);
    sub._level = level;
    document.body.appendChild(sub);
    const r = anchorRow.getBoundingClientRect();
    place(sub, r.right - 6, r.top - 6, r.left);
    requestAnimationFrame(() => sub.classList.add('open'));
    openMenus[level] = sub;
  }

  function place(el, x, y, flipLeftRef){
    const w = el.offsetWidth, h = el.offsetHeight;
    if (x + w > window.innerWidth - 8) x = (flipLeftRef ?? x) - w + 6;
    if (x < 8) x = 8;
    if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
    if (y < 8) y = 8;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
  }

  function closeFrom(level){
    for (let i = openMenus.length - 1; i >= level; i--){
      if (openMenus[i]){ openMenus[i].remove(); openMenus[i] = null; }
    }
    openMenus.length = Math.min(openMenus.length, level);
  }
  function closeAll(){ closeFrom(0); }

  function openAt(x, y){
    closeAll();
    const root = buildMenu(MODEL, false);
    root._level = 0;
    document.body.appendChild(root);
    place(root, x, y);
    requestAnimationFrame(() => root.classList.add('open'));
    openMenus[0] = root;
  }

  // ---- Wiring ----
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    openAt(e.clientX, e.clientY);
  });
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.menu') && !e.target.closest('.toolbar')) closeAll();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });

  document.getElementById('openBtn').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    openAt(r.left, r.bottom + 8);
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    document.getElementById('themeBtn').textContent = (next === 'dark' ? '☾' : '☀') + ' Theme';
  });
</script>
</body>
</html>
