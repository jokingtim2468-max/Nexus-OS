<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FreeForm OS — Loader</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* FreeForm OS — distro loader. Pick a distro (or drop your own); all share
     this same Liquid Glass UI. */
  :root{
    --glass:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.2);
    --rim:rgba(255,255,255,.5); --rim-soft:rgba(255,255,255,.14);
    --text:rgba(255,255,255,.95); --dim:rgba(255,255,255,.55);
    --accent:#0a84ff; --shadow:0 1px 1px rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  html{background:#05141f;}
  body{
    font:14px/1.3 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
    color:var(--text); overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(140% 120% at 18% -5%,#1f7fa8 0,transparent 52%),
      radial-gradient(120% 120% at 92% 8%,#123f6b 0,transparent 55%),
      radial-gradient(130% 140% at 72% 108%,#13b3a6 0,transparent 60%),
      linear-gradient(160deg,#0c3350 0,#082438 55%,#05141f 100%);
    background-attachment:fixed;
  }
  .logo{font-weight:800; font-size:64px; letter-spacing:-2px; line-height:1;
    background:linear-gradient(180deg,#eaf6ff,#9fd8ef); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 18px rgba(0,0,0,.4)); margin-bottom:4px;}
  h1{margin:0; font-size:26px; font-weight:700; letter-spacing:-.01em;}
  .sub{margin:6px 0 26px; color:var(--dim); font-size:15px;}

  .grid{display:grid; grid-template-columns:repeat(5,186px); gap:12px; margin-bottom:20px;
    max-height:60vh; overflow-y:auto; padding:4px;}
  @media (max-width:980px){ .grid{grid-template-columns:repeat(3,1fr); width:92vw;} }
  @media (max-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }

  .card{position:relative; padding:13px; border-radius:14px; cursor:pointer;
    background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--rim-soft); box-shadow:var(--shadow); transition:transform .12s ease, border-color .15s ease;}
  .card::before{content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(150deg,var(--rim) 0,transparent 30%,transparent 72%,var(--rim-soft) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;}
  .card:hover{transform:translateY(-3px);}
  .card.sel{border-color:var(--accent); box-shadow:var(--shadow),0 0 0 2px var(--accent) inset;}
  .card .dot{width:11px; height:11px; border-radius:50%; margin-bottom:10px; box-shadow:0 0 10px currentColor;}
  .card b{display:block; font-size:16px;}
  .card .ed{color:var(--dim); font-size:12px; margin:1px 0 8px;}
  .card .desc{color:var(--dim); font-size:12px; line-height:1.35;}
  .card.custom{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; border-style:dashed;}
  .card.custom .plus{font-size:26px; line-height:1; margin-bottom:8px; color:var(--accent);}

  .row{display:flex; align-items:center; gap:14px;}
  .start{appearance:none; border:none; cursor:pointer; font:600 15px/1 inherit; color:#fff;
    padding:13px 30px; border-radius:12px; background:linear-gradient(180deg,#3a9bff,#0a84ff);
    box-shadow:0 6px 18px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.3);}
  .start:disabled{opacity:.4; cursor:not-allowed;}
  .note{color:var(--dim); font-size:12.5px; margin-top:16px; max-width:660px; text-align:center;}
  .note code{background:var(--glass-hi); padding:1px 6px; border-radius:5px;}
</style>
</head>
<body>
  <div class="logo">FF</div>
  <h1>FreeForm OS</h1>
  <div class="sub">Pick a distro to launch — each runs in its own VM workspace with MacShell</div>

  <div class="grid" id="grid"></div>

  <div class="row">
    <button class="start" id="start" disabled>Start FreeForm →</button>
  </div>

  <div class="note">
    All distros share this identical UI, dock and commands. To use your own:
    download a distro and drop the <code>.iso</code> / rootfs into
    <code>distros/custom/</code> — it appears here automatically.
  </div>

<script>
  // Mirror of distros/registry.json (recommended list) so the loader renders
  // standalone. The real app reads the JSON file directly.
  // Mirrors distros/registry.json (recommended). Real distro ISOs; each boots
  // into its own VM workspace with MacShell.
  const DISTROS = [
    {id:"ubuntu", name:"Ubuntu", ed:"24.04 LTS", accent:"#e95420", desc:"Beginner-friendly, huge driver support."},
    {id:"kubuntu", name:"Kubuntu", ed:"24.04 LTS", accent:"#1d99f3", desc:"Ubuntu with KDE Plasma."},
    {id:"mint", name:"Linux Mint", ed:"22", accent:"#86be43", desc:"Ubuntu-based, very approachable."},
    {id:"popos", name:"Pop!_OS", ed:"22.04", accent:"#48b9c7", desc:"System76's distro, great for NVIDIA."},
    {id:"zorin", name:"Zorin OS", ed:"17", accent:"#0cc1f3", desc:"Windows/macOS-like, newcomer-friendly."},
    {id:"elementary", name:"elementary OS", ed:"8", accent:"#64baff", desc:"Clean, macOS-like out of the box."},
    {id:"debian", name:"Debian", ed:"12 Bookworm", accent:"#d70a53", desc:"Rock-stable base."},
    {id:"fedora", name:"Fedora", ed:"Workstation 40", accent:"#3c6eb4", desc:"Cutting-edge, dnf-based."},
    {id:"nobara", name:"Nobara", ed:"40", accent:"#7c3aed", desc:"Fedora tuned for gaming."},
    {id:"opensuse", name:"openSUSE", ed:"Tumbleweed", accent:"#73ba25", desc:"Rolling, zypper-based."},
    {id:"arch", name:"Arch Linux", ed:"rolling", accent:"#1793d1", desc:"Minimal, pacman."},
    {id:"endeavouros", name:"EndeavourOS", ed:"rolling", accent:"#7f3fbf", desc:"Arch made approachable."},
    {id:"manjaro", name:"Manjaro", ed:"rolling", accent:"#35bf5c", desc:"Arch-based, friendly defaults."},
    {id:"garuda", name:"Garuda", ed:"rolling", accent:"#d03e3e", desc:"Arch-based, gaming-focused."},
    {id:"cachyos", name:"CachyOS", ed:"rolling", accent:"#00b3a4", desc:"Performance-optimized Arch."},
    {id:"kali", name:"Kali Linux", ed:"2024.x", accent:"#367bf0", desc:"Security tooling (600+ tools)."},
    {id:"kali-everything", name:"Kali Everything", ed:"full", accent:"#1f2430", desc:"Every Kali tool preinstalled."},
    {id:"parrot", name:"Parrot OS", ed:"Security 6", accent:"#15bfae", desc:"Dark, privacy-focused security."},
    {id:"blackarch", name:"BlackArch", ed:"rolling", accent:"#2b2b2b", desc:"Arch security, 2800+ tools."},
    {id:"tails", name:"Tails", ed:"6.x", accent:"#56347c", desc:"Amnesic, everything over Tor."},
  ];
  const grid = document.getElementById('grid');
  const start = document.getElementById('start');
  let selected = null;

  DISTROS.forEach(d=>{
    const c = document.createElement('div'); c.className='card'; c.dataset.id=d.id;
    c.innerHTML = `<div class="dot" style="color:${d.accent};background:${d.accent}"></div>
      <b>${d.name}</b><div class="ed">${d.ed}</div><div class="desc">${d.desc}</div>`;
    c.addEventListener('click',()=>{
      document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel'); selected=d.id; start.disabled=false;
      start.textContent=`Start ${d.name} →`;
    });
    grid.appendChild(c);
  });
  // custom card
  const cust = document.createElement('div'); cust.className='card custom';
  cust.innerHTML = `<div class="plus">+</div><b>Custom…</b>
    <div class="desc">Drop a distro file into distros/custom/</div>`;
  cust.addEventListener('click',()=>{ document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
    cust.classList.add('sel'); selected='custom'; start.disabled=false; start.textContent='Start Custom →'; });
  grid.appendChild(cust);

  start.addEventListener('click',()=>{
    // In the real app this boots the chosen distro into the FreeForm shell.
    start.textContent = `Loading ${selected}…`;
  });
</script>
</body>
</html>
